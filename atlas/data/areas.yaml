  primary: false
  confidence: canon
  sources: [knowledges/church_of_the_stars]
  text: Запрещена для публичных служб с 268 г.
- id: area:religion:03
  layer: religion
  value: Церковь Катберта
  scope: state_1006
  ids: [countries/illior_empire/index]
  primary: false
  confidence: canon
  sources: [knowledges/church_of_cuthbert]
  text: Катбертисты преследовались с 811 г.
- id: area:religion:04
  layer: religion
  value: Церковь Звёзд
  scope: state_1006
  ids: [countries/rojo/index, countries/bastion_union/index, countries/drinrog/index]
  primary: true
  confidence: canon
  sources: [knowledges/church_of_the_stars]
  text: 'Ройо: государственная религия с 560–567 гг.; Бастионный союз: церковь в изгнании при Патриархе Герении; Дринрог: приходы.'
- id: area:religion:05
  layer: religion
  value: Церковь Катберта
  scope: state_1006
  ids: [countries/drinrog/index]
  primary: false
  confidence: canon
  sources: [knowledges/church_of_cuthbert]
  text: Община катбертистов с 811 г.; правительство им не радо, открытых гонений нет.
- id: area:religion:06
  layer: religion
  value: Культ Предков
  scope: state_1006
  ids: [countries/gross/index]
  primary: true
  confidence: derived
  sources: [countries/gross/index, knowledges/ancestors_cult]
  text: Официальной религии нет, веротерпимость; в почёте поклонение духам предков.
- id: area:religion:07
  layer: religion
  value: Церковь Катберта
  scope: state_1006
  ids: [countries/gross/index]
  primary: false
  confidence: canon
  sources: [knowledges/church_of_cuthbert]
  text: Община святого Катберта в Ежицке.
- id: area:religion:08
  layer: religion
  value: Пантеон Занры
  scope: state_1006
  ids: [countries/zanra/index]
  primary: true
  confidence: canon
  sources: [knowledges/pantheon_of_zanra]
  text: 'Государственная религия: единая церковь, созданная после независимости 817 г.'
- id: area:religion:09
  layer: religion
  value: Многобожие Игни
  scope: state_1006
  ids: [countries/igni/index]
  primary: true
  confidence: canon
  sources: [knowledges/polytheism_igni]
  text: 'Множество культов больших и малых богов; три главных образа: Мать-река Сарати, воитель Метадр, змей Ниимас.'
- id: area:religion:10
  layer: religion
  value: Культы Залесья
  scope: state_1006
  ids: [countries/zalessk/index]
  primary: true
  confidence: canon
  sources: [knowledges/zalessk_beliefs]
  text: 'Три культа: Большого медведя, Дикой воды, Леса.'
- id: area:religion:11
  layer: religion
  value: Тотемы и духи предков
  scope: state_1006
  ids: [countries/land_of_oases/index]
  primary: true
  confidence: canon
  sources: [knowledges/beliefs_of_the_land_of_oases]
  text: Тотем у каждого племени; духи предков, связь с имперским Культом Предков.
- id: area:religion:12
