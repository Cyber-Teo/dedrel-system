- id: area:religion:01
  layer: religion
  value: Культ Предков
  scope: state_1006
  ids: [countries/illior_empire/index]
  primary: true
  confidence: canon
  sources: [knowledges/ancestors_cult, countries/illior_empire/index]
  text: Без церкви и жрецов; большие празднества на весеннее и осеннее равноденствие.
- id: area:religion:02
  layer: religion
  value: Церковь Звёзд
