- {id: legion:xxi-817, number: XXI, place: geo:zanra, from: 817, to: 817, text: "Местный легион знати Занры, не имперский: набран местной знатью и ей подчинён; 817 г., бунт против префекта.", sources: [countries/zanra/index], confidence: canon}
