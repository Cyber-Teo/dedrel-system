# Легионы империи. from/to — годы, в которые легион по источнику находится в этом месте
# (для базы 1005 г. — «по состоянию на 1005», from=to=1005). place — id места; нет x,y у места — на карту не попадает.
- {id: legion:i-1005, number: I, place: countries/illior_empire/cities/city_illior, from: 1005, to: 1005, text: "Сформирован Малдредом; потомки воинов чтят предков как богов. Командир — Эврипид Август Юний. База: Иллиор и окрестности.", sources: [countries/illior_empire/illior_empire_army, characters/euripdus_junius], confidence: canon}
- {id: legion:ii-1005, number: II, place: geo:visentiya, from: 1005, to: 1005, text: "Охраняет западную границу с Гроссом, собирает пошлины. База: Висентия.", sources: [countries/illior_empire/illior_empire_army], confidence: canon}
- {id: legion:v-1005, number: V, place: geo:kameraska, from: 1005, to: 1005, text: "Воздушное наблюдение за Лесом Ужасов; Камераска, Форт Болотный. База: около Камераски.", sources: [countries/illior_empire/illior_empire_army], confidence: canon}
- {id: legion:vi-1005, number: VI, place: geo:greyheld, from: 1005, to: 1005, text: "Дозор на севере: Лес Ужасов, Подменный лес. Командир — Авдикий Гердоний. База: около Грейхельда.", sources: [countries/illior_empire/illior_empire_army, characters/avdikiy_gerdonius], confidence: canon}
- {id: legion:ix-1005, number: IX, place: geo:erelon, from: 1005, to: 1005, text: "Южная граница, Мёртвые горы; один из самых боеспособных. База: около Эрелона.", sources: [countries/illior_empire/illior_empire_army, characters/augustus_junia], confidence: canon}
- {id: legion:xiii-1005, number: XIII, place: geo:sibaris, from: 1005, to: 1005, text: "Речной флот на Лиоре. База: Сибарис.", sources: [countries/illior_empire/illior_empire_army], confidence: canon}
- {id: legion:xxiii-1005, number: XXIII, place: geo:greyheld, from: 1005, to: 1005, text: "Сформирован в 1005 г. на деньги Октавия Опия против сепаратизма Руна; встаёт в Грейхельде.", sources: [countries/illior_empire/illior_empire_army, characters/oktavius_opius], confidence: canon}
- {id: legion:xxiv-1005, number: XXIV, place: countries/illior_empire/cities/city_illior, from: 1005, to: 1005, text: "«Женский» легион 1005 г. на деньги Алии Сульпиции; командир — Мария Хосе Помар; за десять дней идёт к Деламоте и Даниру. Место базы в источнике не указано: показан в Иллиоре, где аристократки собирали людей и деньги.", sources: [countries/illior_empire/illior_empire_army, history/second_igni_rojo_war, characters/maria_pomar], confidence: derived}
- {id: legion:iii-267, number: III, place: geo:korilla, from: 267, to: 267, text: "Топит в крови бунт в Корилле (префектура Ройо); около тысячи пленных распяли вдоль тракта у Иллиора.", sources: [history/era_imperial, countries/rojo/index], confidence: canon}
- {id: legion:iii-573, number: III, place: geo:bersan, from: 573, to: 573, text: "Легат (его заранее подкупили) отказывается выполнять приказ подавить бунт в Берсане; легион бездействует.", sources: [countries/gross/index, history/era_troubles], confidence: canon}
- {id: legion:iv-573, number: IV, place: geo:bersan, from: 573, to: 573, text: "Легат открыто переходит на сторону мятежников в Берсане; легион бездействует.", sources: [countries/gross/index, history/era_troubles], confidence: canon}
- {id: legion:vi-612, number: VI, place: geo:greyheld, from: 612, to: 612, text: "Бунт в Руне: VI легион берёт Грейхельд.", sources: [history/era_troubles, countries/illior_empire/index], confidence: canon}
- {id: legion:vii-777, number: VII, place: geo:drinrog, from: 777, to: 777, text: "Разоружён и отпущен при перевороте в Дринроге (Чёрные всадники Энфориса).", sources: [countries/drinrog/index, countries/enforis/index], confidence: canon}
- {id: legion:x-754, number: X, place: geo:kortona, from: 754, to: 817, text: "Гарнизон города-крепости Кортона на Арвебеле (колония Ралоро), 754–817.", sources: [countries/sunny_islands/elka_s_oligarchy, history/era_troubles], confidence: canon}
- {id: legion:xiv-929, number: XIV, place: geo:kray_run, from: 929, to: 929, text: "Авл с XIV легионом мирно улаживает забастовку железа и угля в Руне.", sources: [history/era_new_age, guilds/metal_makers], confidence: canon}
- {id: legion:xvii-452, number: XVII, place: countries/arnost/index, from: 452, to: 452, text: "Риклаэрон отправляет XVII легион в Арност.", sources: [countries/vishnevodskoye_principality/index], confidence: canon}
