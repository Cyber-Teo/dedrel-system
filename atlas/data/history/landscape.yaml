  confidence: derived
  sources: [history/great_war, geography/long_swamp, map:растр]
  note: Событие датировано ≈−500…−490 (проклятие Денрары создаёт Долгое и Морозное болота); взято начало диапазона −500. Контур — как на растре, до проклятия там были земли Первых людей.
