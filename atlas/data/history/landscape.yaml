  sources: [history/great_war, history/era_great_war_summary, geo:vilarinskie_bolota, geo:arkadiya, map:растр]
  note: Аркадия пала ≈−290 и «поглощена болотами»; Виларинские болота — «большая часть префектуры Виларин», у участков свои имена. Полигон — два названных болота префектуры (Болото чёрного пламени, Болото пляшущих молний), весь контур Виларинских болот на карте не выделен. Другая версия — земли у Аркадии отравлены уже Битвой при Аркадии (после −490).
