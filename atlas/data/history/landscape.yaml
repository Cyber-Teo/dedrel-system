# Ландшафт по эпохам: объект отсутствует до года absent_before (на карте закрыт цветом суши с подписью label),
# с этого года виден как нарисован на растре. Геометрия — id полигонов из data/geo/terrain.geojson или data/geo/inner-sea.geojson.
# event — событие из data/events.yaml, по которому назначен год.
- id: landscape:inner_sea
  name: Внутреннее море
  absent_before: -490
  label: "Внутреннего моря ещё нет: до −490"
  geometry: [landscape:inner_sea]
  event: ev:-490:bitva_ognennoy_yarosti
  confidence: derived
  sources: [history/great_war, history/era_great_war_summary, geo:vnutrennee_more, map:растр]
  note: Битва Огненной ярости ≈−490 — «образуется Внутреннее море». До неё на этом месте суша. Форма суши — по контуру моря на растре (граница с океаном — хорда через Солнечный пролив), поэтому derived.
