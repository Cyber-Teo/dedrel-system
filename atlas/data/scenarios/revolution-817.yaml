# Сценарий: Иллиорская революция 817 года и её последствия (апрель 817 — январь 818).
# Источники: вики history/era_troubles (ход событий), events.yaml (ev:817:*, ev:818:reformy_*). Только то, что сказано там.
# Цитадель Основателя и Драконья стража на карте не отмечены (нет координат): камера ставится на Иллиор.
id: revolution-817
title: Иллиорская революция (817)
summary: 'Апрель 817: бунт в Иллиоре, статут о сенате, отделение Занры, Всесожжение Микриса и реформы Аны в январе 818.'
sources: [history/era_troubles]
steps:
  - title: Накануне
    date: { year: 817, label: 817 год, note: без точной даты }
    text: >-
      Положение в стране критическое. Некоторые гильдии бастуют, легионеры грабят местных жителей, чтобы прокормиться, а казна
      почти пуста из-за взяточничества и бестолкового управления. Это канун Иллиорской революции.
    camera: { place: countries/illior_empire/cities/city_illior, zoom: 3 }
    highlight: { places: [countries/illior_empire/cities/city_illior] }
    sources: [history/era_troubles]
  - title: 7 апреля — народ на улицах
    date: { year: 817, month: 4, day: 7 }
    text: >-
      Седьмого апреля на улицах Иллиора собирается недовольный народ. Одних злит, что императорская семья не может удержать
      провинции, других — положение хозяйства и взяточничество, третьих — цензура и репрессии. II легион остаётся в казармах
      и не пытается разогнать толпу; так же решает и городская стража.
    camera: { place: countries/illior_empire/cities/city_illior, zoom: 4.2 }
    highlight: { places: [countries/illior_empire/cities/city_illior] }
    sources: [history/era_troubles]
  - title: 9 апреля — столица у восставших
    date: { year: 817, month: 4, day: 9 }
    text: >-
      К девятому апреля столица полностью в руках восставших: повсюду погромы, горят правительственные здания, толпа осаждает
      тюрьму и казармы стражи. Сенат и императорская семья укрываются в цитадели Основателя под защитой лейб-гвардии — Драконьей
      стражи. Вся империя замирает в ожидании.
    camera: { place: countries/illior_empire/cities/city_illior, zoom: 5 }
    highlight: { places: [countries/illior_empire/cities/city_illior] }
    sources: [history/era_troubles]
  - title: 10 апреля — статут о сенате
    date: { year: 817, month: 4, day: 10 }
    text: >-
      Представители пяти древних родов Иллиора — Сульпиции, Фурии, Эмилии, Клавдии и Лариции — договариваются с восставшими:
      власть императорской семьи будет ограничена, а в сенате появятся и низшие сословия. Драконья стража встаёт на сторону знати,
      и вместе они убеждают императора подписать статут о сенате. У народа в новом сенате оказывается одно место. Сенат отменяет
      цензуру, вновь открывает Иллиорскую коллегию бардов, объявляет амнистию, вводит налоговые льготы и распускает бо́льшую часть
      имперской разведки.
    camera: { place: countries/illior_empire/cities/city_illior, zoom: 4.6 }
    highlight: { places: [countries/illior_empire/cities/city_illior] }
    sources: [history/era_troubles]
  - title: Через неделю — переворот в Занре
    date: { year: 817, label: через неделю после революции, note: точная дата в вики не названа }
    text: >-
      Префектура Занра объявляет об отделении от империи и создании королевства. Префекта убивают; имперских легионов в крае
      в тот момент нет. Сенат не готов воевать и признаёт независимость нового государства при условии, что оно выплатит империи
      компенсацию. Королевой становится Ана Кезон-Эбуций.
      На карте Занра отдельно с кадра 818: более раннего кадра политики с ней нет.
    camera: { place: geo:zanra, zoom: 3.6 }
    highlight: { places: [geo:zanra, geo:mikris] }
    owners_at: 818
    sources: [history/era_troubles, countries/zanra/index]
  - title: Всесожжение Микриса
    date: { year: 817, label: через месяц после сбора легиона, note: дата в вики не названа }
    text: >-
      Молодые представители Опиев, Папириев, Марциев и Горациев собирают добровольческий легион, чтобы вернуть Занру: за месяц набирается около двадцати
      тысяч человек. Войско выступает из лагеря под Иллиором и доходит до столицы префектуры, города Микрис, и входит в него без сопротивления — город оказывается
      заминирован порохом, тайно изобретённым в Занре. Из двадцати тысяч уцелели три тысячи. Затем Занра отправляет в Иллиор
      оговорённую компенсацию с письмом о «запланированном сносе города». Линия на карте схематична: путь войска вики не описывает.
    camera: { place: geo:mikris, zoom: 4 }
    highlight:
      places: [geo:mikris, countries/illior_empire/cities/city_illior]
      lines: [{ label: 'поход добровольцев на Микрис (схематично, по прямой)', via: [countries/illior_empire/cities/city_illior, geo:mikris] }]
    owners_at: 818
    sources: [history/era_troubles, countries/zanra/index]
  - title: Январь 818 — реформы Аны
    date: { year: 818, month: 1 }
    text: >-
      Двенадцать гильдий Занры становятся департаментами, земля переходит к короне, вводятся прогрессивный налог и бумажные деньги,
      создаётся Пантеон Занры: новое правительство объединяет разрозненные культы в единую церковь с каноном и иерархией.
      Расхождение в вики: страница о Пантеоне относит создание единой церкви к 817 году (после обретения независимости),
      страница Занры — к реформам января 818.
    camera: { place: geo:zanra, zoom: 3.6 }
    highlight: { places: [geo:zanra], polities: [countries/zanra/index] }
    owners_at: 818
    sources: [countries/zanra/index, knowledges/pantheon_of_zanra]
