# Сценарий: Катастрофа в Арносте, 4 октября — 21 ноября 672.
# Источник: вики history/arnost_catastrophe. Только то, что сказано там; места без координат в газеттире на карте не рисуются.
# camera: place (id места) | px [x, y]; zoom 1–8. highlight: places — id мест; lines — отрезки по id мест или пикселям карты [x, y];
# polities — id государства из data/history/owners.yaml (подсветка границ ячеек, включает слой «Политика по годам»).
id: arnost-672
title: Катастрофа в Арносте (672)
summary: 'Ночь на 4 октября 672 года: туман над Нордхельдом, нежить, два фронта, перенос столицы префектуры в Вышневодск.'
sources: [history/arnost_catastrophe]
steps:
  - title: Накануне
    date: { year: 672, label: 672 год, note: без точной даты }
    text: >-
      Империей формально правит Гней II, но император недееспособен, и все решения принимает сенат. Арност — обширная северная префектура
      (столица — Нордхельд): рудники Серебряных гор, поиск артефактов Великой войны на болотах, промысел чудовищ. Через Нордхельд идёт
      единственная надёжная дорога в Залесск — укреплённый тракт до Вышпы.
    camera: { place: geo:nordheld, zoom: 3.2 }
    highlight:
      places: [geo:nordheld, geo:vyshpa, geo:zalessk]
      lines: [{ label: 'тракт Нордхельд — Вышпа (схематично, по прямой)', via: [geo:nordheld, geo:vyshpa] }]
    sources: [history/arnost_catastrophe]
  - title: Города перестают выходить на связь
    date: { year: 672, month: 10, day: 4, time: около полуночи }
    text: >-
      Множество городов префектуры одновременно перестают выходить на связь; тех, кого первыми отправили туда через постоянные круги
      телепортации гильдии Арканум, постигает та же участь. Над Нордхельдом видели нестерпимо яркую вспышку фиолетового света;
      в Нордхельде и нескольких других городах поднялся густой туман и пополз по округе. Многие из тех, кого накрыл туман, мгновенно
      обратились в нежить. До утра руководство берёт на себя глава департамента стражи империи Сарану Ветулена.
    camera: { place: geo:nordheld, zoom: 3.6 }
    highlight: { places: [geo:nordheld] }
    sources: [history/arnost_catastrophe]
  - title: Легионы выступают
    date: { year: 672, month: 10, day: 4, time: '01:00' }
    text: >-
      Из Вышневодска на запад выступает XVII легион, из Грейхельда на север — VI легион, часть XIII легиона идёт к Метису.
      Направление XVII и VI легионов в источнике названо словами; на карте отмечены только пункты и переход к Метису.
    camera: { px: [6200, 1250], zoom: 3.0 }
    highlight:
      places: [geo:vyshnevodsk, geo:greyheld, geo:metis, geo:nordheld]
      lines: [{ label: 'часть XIII легиона — к Метису', via: [geo:greyheld, geo:metis] }]
    sources: [history/arnost_catastrophe]
  - title: Последнее сообщение экспедиции Будоса
    date: { year: 672, month: 10, day: 4, time: '03:00–03:30' }
    text: >-
      Сарану приказывает придворным магам отправиться в Нордхельд и выяснить, что произошло. Вызывается ректор Виларинского университета,
      архимаг Будос; вместе с ним уходят одни из сильнейших магов империи. Через полчаса после телепортации Сарану получает от одного
      из них сообщение: «Это конец». Больше от экспедиции вестей нет.
    camera: { place: geo:nordheld, zoom: 4 }
    highlight: { places: [geo:nordheld] }
    sources: [history/arnost_catastrophe]
  - title: Два фронта
    date: { year: 672, month: 10, day: 4, time: '05:00' }
    text: >-
      Страже и ополчению удаётся выстроить два фронта: на востоке — по Хунсельну, Хаславу и Ледоморску, на юге — по Бордыме, Каррану
      и Бирсдорфу. Лес Ужасов кишит нежитью, Метис в окружении. Сарану перебрасывает с границы Гросса VII легион. На карте — только те
      пункты фронтов, у которых есть координаты (Хунсельн, Хаслав и Карран координат не имеют); южная линия проведена по Бордыме и Бирсдорфу.
    camera: { px: [6050, 1050], zoom: 3.0 }
    highlight:
      places: [geo:ledomorsk, geo:bordyma, geo:birsdorf, geo:metis, geography/forest_of_horrors]
      lines: [{ label: 'южный фронт (по Бордыме и Бирсдорфу)', via: [geo:bordyma, geo:birsdorf] }]
    sources: [history/arnost_catastrophe]
  - title: Рассвет и сенат
    date: { year: 672, month: 10, day: 4, time: рассвет — 17:00 }
    text: >-
      На рассвете нежить резко затихает и отступает в туман; туман остаётся на месте даже под солнцем. В 07:00 собирается сенат: решено
      попытаться отбить префектуру, командующим назначен Вопискус Юний, создаётся комиссия по расследованию. В 17:00 из тумана к Грейхельду
      выходит колонна беженцев под охраной уцелевших солдат VIII легиона. На закате нежить снова наступает; на границы переброшены
      наёмники гильдий Серый Авангард, Огненная Саламандра и Арканум.
    camera: { place: countries/illior_empire/cities/city_illior, zoom: 3.0 }
    highlight: { places: [countries/illior_empire/cities/city_illior, geo:greyheld] }
    sources: [history/arnost_catastrophe]
  - title: Зачистка на юге
    date: { year: 672, month: 10, day: 6 }
    text: >-
      Вопискус Юний с VII легионом и ополчением выходит к южной границе Арноста и соединяется с VI легионом. Бои в Лесу Ужасов особенно
      тяжелы; VI, VII и XIII легионам удаётся сомкнуться в широкий фронт и выйти на границу между Рун и Арностом. XVII легион отбрасывает
      нежить на востоке до самой кромки тумана.
    camera: { place: geography/forest_of_horrors, zoom: 3.6 }
    highlight: { places: [geography/forest_of_horrors, geo:metis, geo:bordyma] }
    sources: [history/arnost_catastrophe]
  - title: Отряд за линией тумана
    date: { year: 672, month: 10, day: 14 }
    text: >-
      Вопискус Юний бросает часть VI легиона и наёмников за линию тумана, к городу Халлтренк. Возвращаются лишь те, кто следил за
      продвижением отряда с большой высоты. Что случилось с остальными, из-за тумана неизвестно. 17 октября, по слухам, в Арност пытается
      прорваться отряд драконов и терпит такое же поражение; официально об этом ничего не сообщают. Халлтренк на карте не отмечен: координат нет.
    camera: { place: geo:nordheld, zoom: 3.2 }
    highlight: { places: [geo:nordheld] }
    sources: [history/arnost_catastrophe]
  - title: Туман исчезает, поход на 30 км
    date: { year: 672, month: 10, day: 31 }
    text: >-
      На рассвете туман исчезает. Вопискус Юний снова пытается войти на захваченные земли, на этот раз с XVII легионом и некромантами
      Вышневодска. Войскам удаётся пройти на 30 километров за бывшую линию тумана и разбить небольшой лагерь. Всю ночь на лагерь
      нападают, но на следующий день отряд благополучно возвращается в укреплённый район.
    camera: { place: geo:vyshnevodsk, zoom: 3.4 }
    highlight: { places: [geo:vyshnevodsk, geo:nordheld] }
    sources: [history/arnost_catastrophe]
  - title: Указ о зоне отчуждения
    date: { year: 672, month: 11, day: 21 }
    text: >-
      От имени императора Гнея II выходит указ: столица префектуры Арност переносится в Вышневодск, занятые нежитью земли объявляются
      запретными, департаменту стражи поручено создать зону отчуждения. Указ подписал сенат от имени недееспособного императора,
      в обход императорской канцелярии. Погибли около 150 000 человек, примерно столько же лишились крова.
    camera: { place: geo:vyshnevodsk, zoom: 3.2 }
    highlight:
      places: [geo:vyshnevodsk, geo:nordheld]
      polities: [countries/arnost/index]
    sources: [history/arnost_catastrophe]
  - title: Последствия для Залесска
    date: { year: 672, month: 11, day: 21, note: итог }
    text: >-
      Сухопутный путь в Залесск оборвался: империя пыталась проложить новый путь до Вышпы (1–20 ноября), но Долгое болото стало почти
      непроходимым. Укреплённый тракт из Вышпы в Нордхельд сохранился, но ведёт теперь в мёртвые земли. С этого времени фактически
      начинается независимость Залесского княжества.
    camera: { place: geo:vyshpa, zoom: 3.2 }
    highlight:
      places: [geo:nordheld, geo:vyshpa, geo:zalessk]
      lines: [{ label: 'тракт Вышпа — Нордхельд (схематично)', via: [geo:vyshpa, geo:nordheld] }]
    sources: [history/arnost_catastrophe]
