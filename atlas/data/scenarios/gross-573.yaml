# Сценарий: Переворот в Гроссе 573 года (апрель — август 573).
# Источники: вики countries/gross/index и history/era_troubles. Только то, что сказано там.
# Расхождение вики: era_troubles пишет, что префекта выдворили «при поддержке III и IV легионов»; страница Гросса — что легат IV перешёл
# к мятежникам, а легат III лишь отказался выполнять приказ (его заранее подкупили). Берём подробное описание страницы Гросса.
# Кадр политики: до сейма — 572 (Гросс в империи), после — 573 (отдельное королевство).
id: gross-573
title: Переворот в Гроссе (573)
summary: 'Апрель 573: гросская аристократия берёт Берсан, легионы бездействуют, через неделю сейм избирает королеву, в августе империя признаёт независимость.'
sources: [countries/gross/index, history/era_troubles]
steps:
  - title: Десять лет подготовки
    date: { year: 573, label: до апреля 573, note: подготовка длилась около десяти лет }
    text: >-
      Когда в 560-х годах восстало Ройо, Гросс оказался прифронтовой провинцией: он потерял часть земель, а армии империи
      безжалостно его обирали. Около десяти лет гросская аристократия готовила переворот. Недовольство империей копилось здесь годами.
    camera: { place: geo:bersan, zoom: 3.4 }
    highlight: { places: [geo:bersan] }
    owners_at: 572
    sources: [countries/gross/index, history/era_troubles]
  - title: Апрель — штурм дворца в Берсане
    date: { year: 573, month: 4, note: день в вики не назван }
    text: >-
      В апреле гросская аристократия приводит в действие давний план. Группа мятежников при поддержке ополчения стремительно берёт
      штурмом дворец в Берсане и захватывает префекта. В то же время во всех крупных городах бунтовщики захватывают органы власти
      и задерживают имперских чиновников. Обошлось почти без крови.
    camera: { place: geo:bersan, zoom: 5 }
    highlight: { places: [geo:bersan] }
    owners_at: 572
    sources: [countries/gross/index, history/era_troubles]
  - title: Легионы бездействуют
    date: { year: 573, month: 4, note: день в вики не назван }
    text: >-
      Императрица Энфина приказывает III и IV легионам, расквартированным в префектуре, подавить бунт, но легионы бездействуют:
      легат IV легиона открыто переходит на сторону мятежников, а легат III легиона просто отказывается выполнять приказ (известно,
      что его заранее подкупили). Вики расходится в деталях: история Смутных годов говорит о бескровном выдворении префекта
      «при поддержке III и IV легионов».
    camera: { place: geo:bersan, zoom: 4.2 }
    highlight: { places: [geo:bersan] }
    owners_at: 572
    sources: [countries/gross/index, history/era_troubles]
  - title: Империя не успевает
    date: { year: 573, month: 4, note: день в вики не назван }
    text: >-
      Иллиор, и без того истощённый войной с Ройо, пытается быстро собрать войска и перебросить их к границам Гросса, но дело идёт
      медленно. Сил на новую войну, да ещё так близко к столице, у империи уже нет.
    camera: { place: countries/illior_empire/cities/city_illior, zoom: 3 }
    highlight: { places: [countries/illior_empire/cities/city_illior, geo:bersan] }
    owners_at: 572
    sources: [countries/gross/index, history/era_troubles]
  - title: Сейм избирает королеву
    date: { year: 573, label: через неделю после переворота, note: точная дата в вики не названа }
    text: >-
      Впервые за много столетий собирается сейм Гросса — собрание представителей всех знатных родов. Сейм объявляет о разрыве
      вассального договора с Иллиором и восстановлении королевства Гросс и единогласно избирает королевой Болеславу Полонску.
      Начинаются переговоры с империей: королева настаивает, что иллиорцы и гроссцы — братские народы и воевать им незачем.
      Переговоры тянутся до конца лета.
    camera: { place: geo:bersan, zoom: 4.6 }
    highlight: { places: [geo:bersan] }
    owners_at: 573
    sources: [countries/gross/index, history/era_troubles]
  - title: Август — империя признаёт независимость
    date: { year: 573, month: 8, note: день в вики не назван }
    text: >-
      Императрица Энфина признаёт независимость королевств Гросс и Ройо. Корону Гросс она в Берсан так и не возвращает: та до сих
      пор хранится в императорской сокровищнице. Обретя независимость, гроссцы затем начинают войну с Ройо, которая тянется с 573 года
      до 620-х.
    camera: { place: geo:bersan, zoom: 3 }
    highlight: { places: [geo:bersan, countries/illior_empire/cities/city_illior] }
    owners_at: 573
    sources: [countries/gross/index, history/era_troubles]
