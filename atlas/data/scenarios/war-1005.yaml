# Сценарий: Вторая война Игни и Ройо, конец марта — 7 ноября 1005.
# Источник: вики history/second_igni_rojo_war. Места без координат (Кровавый оазис, Аббатство Неугасимого Пламени) на карте не рисуются:
# камера ставится на ближайшее место, названное в тексте вики.
id: war-1005
title: Вторая война Игни и Ройо (1005)
summary: 'Помесячно: от вторжения махараджи Чандера до мира 7 ноября и протектората Иллиорской империи над Ройо.'
sources: [history/second_igni_rojo_war]
steps:
  - title: Игни нарушает договор
    date: { year: 1005, month: 3, label: конец марта 1005 }
    text: >-
      Первая война Ройо и Игни началась в 625 году и формально завершилась договором в 950-м, но стычки не прекращались. В конце марта
      1005 года махараджа Игни Чандер нарушил договор, собрал огромное войско (во многом наёмники — кочевники Ничьей пустыни и выходцы
      с Плато Архидемона) и двинул его на север. Для Ройо война стала неожиданностью; король Мигель I собрал рыцарей, открыл золотые
      резервы и нанимал людей всех ремёсел.
    camera: { px: [2900, 3700], zoom: 2.6 }
    highlight: { places: [geo:knyazhestvo_igni, geo:nichya_pustynya, countries/igni/regions/west_bank], polities: [countries/igni/index] }
    owners_at: 1005
    sources: [history/second_igni_rojo_war]
  - title: Апрель — Кровавый оазис, Фиурни, Алимора
    date: { year: 1005, month: 4 }
    text: >-
      При поддержке кочевников войска Игни заняли Кровавый оазис в Ничьей пустыне и стали стягиваться к реке Виверне. Пограничные отряды
      Ройо потерпели несколько поражений и отступили к Вестхельду. За месяц Игни захватили север Западного берега, в том числе города
      Фиурни и Алимору. В окрестностях Фанкаменто местные жители начали партизанскую войну. Кровавый оазис на карте не отмечен (нет координат).
    camera: { px: [2900, 3400], zoom: 3.2 }
    highlight: { places: [geo:fiurni, geo:alimora, geo:vestheld, geo:nichya_pustynya] }
    owners_at: 1005
    sources: [history/second_igni_rojo_war]
  - title: Май — бои за Вестхельд
    date: { year: 1005, month: 5 }
    text: >-
      Весь месяц шли ожесточённые бои за руины Вестхельда. Король Мигель I лично руководил обороной; ближе к концу месяца его ранили,
      и ему пришлось покинуть передовую. Империя, Занра, Гросс, Энфорис и Дринрог осудили нападение, но вмешиваться не стали;
      Дринрог запретил хождение монет Игни и ограничил торговлю.
    camera: { place: geo:vestheld, zoom: 4 }
    highlight: { places: [geo:vestheld] }
    owners_at: 1005
    sources: [history/second_igni_rojo_war]
  - title: Июнь — падение Вестхельда
    date: { year: 1005, month: 6 }
    text: >-
      В начале месяца Вестхельд пал. Дезорганизованные войска Ройо бежали к Наджиру — последнему крупному городу Западного берега,
      остававшемуся за ними; многие дезертировали, несколько герцогов попали в плен. Казна пустела, на севере ожили банды из земель
      Хрэлл. Гильдия металлургов объявила эмбарго на продажу металлов в Игни.
    camera: { px: [3300, 3550], zoom: 3.6 }
    highlight:
      places: [geo:vestheld, geo:nadzhir]
      lines: [{ label: 'отступление войск Ройо к Наджиру', via: [geo:vestheld, geo:nadzhir] }]
    owners_at: 1005
    sources: [history/second_igni_rojo_war]
  - title: Июль — убийство Мигеля I в Наджире
    date: { year: 1005, month: 7 }
    text: >-
      Короля Мигеля I, руководившего обороной Наджира, убил ассасин. Гибель короля подорвала боевой дух, и через несколько дней город
      оказался в руках махараджи — а с ним и весь Западный берег. Взятие Наджира сопровождалось резнёй. Флот Ройо вывез не больше пятой
      части защитников. Война переместилась на море: флот Ройо пресекал все попытки Игни пересечь Солнечный пролив. В спешке
      короновали двенадцатилетнюю дочь Мигеля Морену; от её имени правил регент Хуан Мануэль Мендоза.
    camera: { place: geo:nadzhir, zoom: 4.2 }
    highlight: { places: [geo:nadzhir] }
    owners_at: 1005.5
    sources: [history/second_igni_rojo_war]
  - title: Август — десант у Аббатства Неугасимого Пламени
    date: { year: 1005, month: 8, label: начало августа 1005 }
    text: >-
      В начале августа армии сошлись в генеральном сражении у Аббатства Неугасимого Пламени. На наспех собранном флоте Игни прорвались
      к побережью Данира и высадили до 40 000 человек. Неожиданно в бой вступили служители Церкви Звёзд: они призвали невиданных прежде
      тварей, которые переломили ход битвы. Больше половины десанта погибло в бою, часть отступавших добили остатки флота Ройо.
      Аббатство на карте не отмечено (нет координат); оно «неподалёку от Данира».
    camera: { place: geo:danir_gorod, zoom: 4 }
    highlight: { places: [geo:danir_gorod] }
    owners_at: 1005.5
    sources: [history/second_igni_rojo_war]
  - title: Сентябрь — огненная чума
    date: { year: 1005, month: 9 }
    text: >-
      Вспышка огненной чумы закрыла границы и остановила торговлю по всему миру, и война Ройо и Игни на время замерла. В Иллиорской
      империи дом Сульпициев объявил о формировании на свои средства XXIV легиона.
    camera: { px: [3700, 3300], zoom: 2.2 }
    highlight: { places: [geo:danir_gorod, geo:royo] }
    owners_at: 1005.5
    sources: [history/second_igni_rojo_war]
  - title: Октябрь — схизма и Эспинар в Данире
    date: { year: 1005, month: 10, label: начало октября 1005 }
    text: >-
      В начале месяца в южных провинциях обострился раскол внутри Церкви Звёзд. Верховный Вендикатор Августин Эспинар собрал из нищего
      люда огромное ополчение и двинулся к Аббатству Неугасимого Пламени. Дойдя до Данира, он обвинил Патриарха в ереси и провозгласил
      себя Патриархом военного времени; его власть признали аристократы, духовенство и монахи Аббатства. Патриарх Сальвадор Герений бежал
      в неизвестном направлении. Боёв на фронте почти не было: армия махараджи разваливалась, наёмники уходили домой.
    camera: { place: geo:danir_gorod, zoom: 4 }
    highlight: { places: [geo:danir_gorod], polities: [countries/rojo/index] }
    owners_at: 1005.5
    sources: [history/second_igni_rojo_war]
  - title: Октябрь — Джок и XXIV легион идут на Данир
    date: { year: 1005, month: 10, label: конец октября 1005 }
    text: >-
      В разгар смуты из замка Деламота о своих правах на престол заявил самозваный граф Хрэлла Джок Сильвертуф — потомок рода Веласкез.
      Император Йорик признал его притязания и приказал XXIV легиону под командованием Марии Хосе Помар выступить к Даниру. За десять
      дней легион дошёл до Деламоты, соединился с войском Джока и двинулся к столице. Население не оказало сопротивления; вендикатор
      встретил Джока с королевскими почестями и помазал его на престол.
    camera: { px: [4180, 2920], zoom: 4.4 }
    highlight:
      places: [geo:delamota, geo:danir_gorod]
      lines: [{ label: 'Джок и XXIV легион — от Деламоты к Даниру', via: [geo:delamota, geo:danir_gorod] }]
    owners_at: 1005.5
    sources: [history/second_igni_rojo_war]
  - title: Октябрь — протекторат
    date: { year: 1005, month: 10, label: конец октября 1005 }
    text: >-
      Первым же решением новый король Джок Веласкез-Деламота попросил императора взять Ройо под защиту, и император объявил королевство
      протекторатом Иллиорской империи. Цепь замков Пламенеющая, Монтелуё и Неприступная не признала нового короля и будущий мир с Игни —
      так родился Бастионный союз. Часть аристократии и духовенства бежала на Солнечные острова, где сложилось правительство Ройо в изгнании.
    camera: { place: geo:royo, zoom: 3.4 }
    highlight: { places: [geo:danir_gorod, geo:royo], polities: [countries/rojo/index] }
    owners_at: 1005.85
    sources: [history/second_igni_rojo_war]
  - title: 7 ноября — мир
    date: { year: 1005, month: 11, day: 7 }
    text: >-
      Перед угрозой войны с империей Игни пошли на переговоры (от Игни — Амджад Аль-Бакир, от Ройо — король Джок). Ройо признало себя
      проигравшей стороной и навсегда отказалось от притязаний на Западный берег; все захваченные земли отошли княжеству. Ройо обязалось
      выплатить репарации: 700 000 золотых и 7000 единиц оружия — долг взяла на себя империя. 7 ноября, в последний день Фестиваля
      Предков, стороны подписали документы. Генерал Стефан Анзанарес заявил, что договор не признаёт. Фиурни и Алимора, занятые Игни
      ещё в апреле, остались княжеству. Место подписания в вики не названо; на карте показаны отошедшие земли.
    camera: { place: geo:alimora, zoom: 3.0 }
    highlight:
      places: [geo:fiurni, geo:alimora, countries/igni/regions/west_bank, geo:nichya_pustynya]
      polities: [countries/igni/index]
    owners_at: 1005.85
    sources: [history/second_igni_rojo_war]
