# Опасные зоны. threat — вид угрозы; radius_km — только если назван источником; from — год начала (если известен).
- {id: haz:forest-horrors, name: "Лес Ужасов", threat: "нежить и чудовища", place: geography/forest_of_horrors, from: 181, text: "Источник чудовищ в войне 181–184 гг.; в 672 кишит нежитью; патрулирует VI легион. На севере империи, между Руном, Арностом и Вышневодьем.", sources: [geography/forest_of_horrors, history/arnost_catastrophe], confidence: canon}
- {id: haz:long-swamp, name: "Долгое болото", threat: "чудовища и ядовитый газ", place: geography/long_swamp, text: "Оттуда приходят чудовища; ядовитые газы, ловушки Великой войны; осушение 431–446 гг. не удалось; после 672 почти непроходимо.", sources: [geography/long_swamp], confidence: canon}
- {id: haz:frosty-marsh, name: "Морозное болото", threat: "нежить", place: geography/frosty_marsh, from: 672, text: "Проклято Денраррой; в 672 кишит нежитью на пути Нордхельд–Вышпа.", sources: [geography/frosty_marsh], confidence: canon}
- {id: haz:changeling-forest, name: "Подменный лес", threat: "чудовища, нежить, банды", place: geography/changeling_forest, text: "Опасно уже в 20–30 км от тракта; чудовища, нежить, банды из Хрэлла, слухи о феях.", sources: [geography/changeling_forest], confidence: canon}
- {id: haz:old-forest, name: "Старый лес", threat: "нежить и чудовища", place: geography/old_forest, from: 181, text: "Очаг нападений чудовищ в 181–184 гг.; после 720 г. полон нежити.", sources: [geography/old_forest], confidence: canon}
- {id: haz:razor-bay, name: "Залив Бритвенных скал", threat: "рифы", place: geo:zaliv_britvennyh_skal, text: "Плавание крайне опасно: рифы; поэтому у Игни почти нет морской торговли и флота.", sources: [geography/monstrous_sea], confidence: canon}
- {id: haz:dark-ocean, name: "Тёмный океан", threat: "тайфуны, кракены, рифы", place: geography/dark_ocean, text: "Два летних месяца — тайфуны; кракены, морские змеи, плотоядные водоросли-острова, магические аномалии, рифы, корабли-призраки.", sources: [geography/dark_ocean], confidence: canon}
- {id: haz:arnost, name: "Арност (зона отчуждения)", threat: "нежить", place: geo:nordheld, from: 672, text: "С 672 г. земля нежити вокруг руин Нордхельда; в 1005 нежить оживилась. Значок — на Нордхельде (эпицентр вспышки 672 г.), зона шире.", sources: [history/arnost_catastrophe, countries/vishnevodskoye_principality/index], confidence: derived}
- {id: haz:horseshoe-trench, name: "Подкова (впадина)", threat: "кракены", place: geo:podkova_vpadina, text: "Круглая глубоководная впадина; кракены, слухи о Морском народе.", sources: [countries/horseshoe_islands/index], confidence: canon}
